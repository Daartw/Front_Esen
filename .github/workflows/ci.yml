name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Pruebas unitarias (Jasmine + Karma) con cobertura
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
      - name: Publicar sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: sitio-compilado
          path: dist/
